name: Deploy Code Arcade to itch.io

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & Publish to itch.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Zip Package for itch.io
        run: |
          mkdir -p dist
          cd public
          zip -r ../dist/code-arcade.zip .
          cd ..

      - name: Set up Butler
        uses: remarkablegames/setup-butler@v3

      - name: Deploy to itch.io
        run: butler push dist/code-arcade.zip rishigamer20062/code-arcade:html5
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
